<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A modern developer portfolio" />
    <title>Rajlaxmi Khode — Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
   <script>
     (function () {
       const isFile = location.protocol === 'file:';
       const base = isFile ? '' : '/';
       const link = document.createElement('link');
       link.rel = 'stylesheet';
       link.href = base + 'style.css';
       document.head.appendChild(link);
     })();
   </script>

  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="#/home" aria-label="Rajlaxmi Khode home">
        <span class="brand-mark">◈</span>
        <span>Rajlaxmi<span class="accent">.Khode</span></span>
      </a>
      <button class="menu-toggle" aria-label="Open navigation" aria-expanded="false">☰</button>
      <nav class="nav-links" aria-label="Main navigation">
        <a href="#/home" data-route="/home">Home</a>
        <a href="#/about" data-route="/about">About</a>
        <a href="#/projects" data-route="/projects">Projects</a>
        <a href="#/skills" data-route="/skills">Skills</a>
        <a href="#/resume" data-route="/resume">Resume</a>                                              
        <a href="#/contact" data-route="/contact">Contact</a>
    

      </nav>
      <button class="theme-toggle" aria-label="Toggle color theme"><span>☼</span><span>☾</span></button>
    </header>

    <main id="app" aria-live="polite"></main>

    <footer>
      <span>© <span id="year"></span> Rajlaxmi Khode.</span>
      <span>Designed with a Carbon Mint pulse.</span>
    </footer>

    <script>
      // Minimal createPreview helper so app.js can create lightweight previews without errors.
      function createPreview(title, color) {
        // Return a simple object; app.js can be updated later to render this as needed.
        return { title, color };
      }
    </script>

    <script>
      (function () {
        const isFile = location.protocol === 'file:';
        const base = isFile ? '' : '/';
        const script = document.createElement('script');
        script.src = base + 'static/app.js';
        document.body.appendChild(script);
      })();
    </script>

  </body>
</html>
